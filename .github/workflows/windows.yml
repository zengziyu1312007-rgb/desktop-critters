name: Windows build and checks
on:
  push:
    branches: [main, codex/windows-port]
    paths: ['windows/**', 'tests/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Ensure installer compiler
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --yes --no-progress }
      - name: Build, test and package
        shell: pwsh
        run: ./windows/build.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-build-${{ github.run_number }}
          path: |
            windows/out/release/*
            windows/out/checks/*
            windows/out/smoke/*
          if-no-files-found: error
          retention-days: 14
